name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for f in $(find wp -name '*.php'); do php -l "$f" || exit 1; done
      - run: bash -n wp/init/isv-entrypoint.sh
      - run: python3 -m py_compile deploy/coolify_deploy.py
      - run: docker compose -f docker-compose.yml config -q
        env: { SERVICE_PASSWORD_DB: x, SERVICE_PASSWORD_DBROOT: x, SERVICE_PASSWORD_WPADMIN: x }
      - run: docker build wp
